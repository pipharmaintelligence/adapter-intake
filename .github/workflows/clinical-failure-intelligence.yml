name: Clinical failure intelligence

on:
  pull_request:
    paths:
      - 'adapters/nusaibah/clinical_failure_intelligence/**'
      - '.github/workflows/clinical-failure-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'adapters/nusaibah/clinical_failure_intelligence/**'
      - '.github/workflows/clinical-failure-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free:
    name: Provider-free ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install provider-free test dependencies
        run: python -m pip install jsonschema==4.25.1 pytest==8.4.2
      - name: Syntax and provider-free suite
        working-directory: adapters/nusaibah/clinical_failure_intelligence
        run: |
          python -m compileall -q .
          python -m pytest tests -q
      - name: Existing repository promotion-shape gate
        run: python -m unittest discover -s tests -p test_adapter_intake_contract.py -v
      - name: Retain scoped source for reproducible clinical qualification
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: clinical-failure-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            adapters/nusaibah/clinical_failure_intelligence/**
            !adapters/nusaibah/clinical_failure_intelligence/**/__pycache__/**
            !adapters/nusaibah/clinical_failure_intelligence/**/*.pyc
          retention-days: 7
          if-no-files-found: error
