name: Adapter intake contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "adapters/**"
      - "tests/test_adapter_intake_contract.py"
      - ".github/workflows/adapter-intake-contract.yml"
  push:
    branches:
      - main
    paths:
      - "adapters/**"
      - "tests/test_adapter_intake_contract.py"
      - ".github/workflows/adapter-intake-contract.yml"

permissions:
  contents: read

jobs:
  intake-contract:
    name: Promotion-shape guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Validate adapter-intake promotion shape
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_adapter_intake_contract.py" -v

      - name: Validate pharma authority budgets and import identities
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s adapters/nusaibah/pharma_company_intelligence_lab/tests -p "test_agent_manifest_contract.py" -v
          python -m unittest discover -s adapters/nusaibah/pharma_company_intelligence_lab/tests -p "test_import_context.py" -v
