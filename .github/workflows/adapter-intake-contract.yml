name: Adapter intake contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "adapters/**"
      - "tests/test_adapter_intake_contract.py"
      - "tests/test_structured_review_toolkit.py"
      - "tests/test_review_exact_spans.py"
      - "tests/test_company_scope.py"
      - "tests/prove_exact_span_worker.py"
      - "tests/prove_review_toolkit_worker.py"
      - ".github/workflows/adapter-intake-contract.yml"
  push:
    branches:
      - main
    paths:
      - "adapters/**"
      - "tests/test_adapter_intake_contract.py"
      - "tests/test_structured_review_toolkit.py"
      - "tests/test_review_exact_spans.py"
      - "tests/test_company_scope.py"
      - "tests/prove_exact_span_worker.py"
      - "tests/prove_review_toolkit_worker.py"
      - ".github/workflows/adapter-intake-contract.yml"

permissions:
  contents: read

jobs:
  intake-contract:
    name: Promotion-shape guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Validate adapter-intake promotion shape
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_adapter_intake_contract.py" -v

      - name: Validate Company Scope without providers or queries
        shell: bash
        env:
          PYTHONPATH: adapters/nusaibah/pharma_company_intelligence_lab/tests/stubs
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_company_scope.py" -v

      - name: Validate complete pharma deterministic test suite
        shell: bash
        env:
          PYTHONPATH: adapters/nusaibah/pharma_company_intelligence_lab/tests/stubs
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s adapters/nusaibah/pharma_company_intelligence_lab/tests \
            -p "test_*.py" \
            -v

      - name: Preflight the declared WP1 development input batch without providers
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python adapters/nusaibah/pharma_company_intelligence_lab/tests/evaluation/project_development_inputs.py \
            --case-id company-small-identity-001 \
            --case-id company-wrong-entity-005 \
            --case-id company-source-injection-006 \
            --case-id company-missing-evidence-007 \
            --case-id company-conflicting-dates-003 \
            --output-dir "${RUNNER_TEMP}/wp1-development-inputs" \
            --pretty

      - name: Retain development input preflight manifest
        uses: actions/upload-artifact@v4
        with:
          name: wp1-development-input-preflight
          path: ${{ runner.temp }}/wp1-development-inputs/projection-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Preflight the quote-selection candidate without providers
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python adapters/nusaibah/pharma_company_intelligence_lab/tests/evaluation/project_development_inputs.py \
            --candidate-version 0.2.2 \
            --case-id company-small-identity-001 \
            --case-id company-wrong-entity-005 \
            --case-id company-source-injection-006 \
            --case-id company-missing-evidence-007 \
            --case-id company-conflicting-dates-003 \
            --output-dir "$RUNNER_TEMP/wp1-quote-inputs" \
            --pretty

      - name: Retain quote-candidate preflight manifest
        uses: actions/upload-artifact@v4
        with:
          name: wp1-quote-input-preflight
          path: ${{ runner.temp }}/wp1-quote-inputs/projection-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Preflight the role-scoped candidate without providers
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python adapters/nusaibah/pharma_company_intelligence_lab/tests/evaluation/project_development_inputs.py \
            --candidate-version 0.2.3 \
            --case-id company-small-identity-001 \
            --case-id company-wrong-entity-005 \
            --case-id company-source-injection-006 \
            --case-id company-missing-evidence-007 \
            --case-id company-conflicting-dates-003 \
            --output-dir "$RUNNER_TEMP/wp1-role-scoped-inputs" \
            --pretty

      - name: Retain role-scoped candidate preflight manifest
        uses: actions/upload-artifact@v4
        with:
          name: wp1-role-scoped-input-preflight
          path: ${{ runner.temp }}/wp1-role-scoped-inputs/projection-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate shared review toolkit and two synthetic consumers
        shell: bash
        env:
          PYTHONPATH: adapters/nusaibah/pharma_company_intelligence_lab/tests/stubs
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_structured_review_toolkit.py" -v
          python -m unittest discover -s tests -p "test_review_exact_spans.py" -v

      - name: Validate evaluation asset packaged imports and baseline parity
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s adapters/nusaibah/pharma_company_intelligence_lab_evaluation/tests \
            -p "test_*.py" \
            -v
