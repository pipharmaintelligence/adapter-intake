name: DLM lake memory candidate
on:
  pull_request:
    paths:
      - 'development/nusaibah/abstract_mcp_dlm_0_1_3/**'
      - 'tests/test_dlm_lake_memory.py'
      - 'plugins/dms-dlm-discovery/**'
      - '.github/workflows/dlm-lake-memory-candidate.yml'
  push:
    branches: ['codex/pi-2047-lake-memory-20261122']
    paths:
      - 'development/nusaibah/abstract_mcp_dlm_0_1_3/**'
      - 'tests/test_dlm_lake_memory.py'
      - 'plugins/dms-dlm-discovery/**'
      - '.github/workflows/dlm-lake-memory-candidate.yml'
permissions:
  contents: read
jobs:
  consumer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Compile candidate and run provider-free consumer tests
        run: |
          python -m compileall -q development/nusaibah/abstract_mcp_dlm_0_1_3
          python -m unittest discover -s tests -p test_dlm_lake_memory.py -v
      - name: Export review-only schemas
        run: python development/nusaibah/abstract_mcp_dlm_0_1_3/export_contracts.py --output-dir '${{ runner.temp }}/dlm-memory-contracts'
      - uses: actions/upload-artifact@v4
        with:
          name: dlm-memory-review-contracts-python-${{ matrix.python }}
          path: ${{ runner.temp }}/dlm-memory-contracts
          if-no-files-found: error
          retention-days: 7
