name: Clinical intelligence draft contracts

on:
  pull_request:
    paths:
      - 'docs/clinical-intelligence-preparation/**'
      - 'tools/check_clinical_preparation.py'
      - 'tests/test_clinical_intelligence_preparation.py'
      - 'tests/test_clinical_gateway_guidance.py'
      - '.github/workflows/clinical-intelligence-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install contract validation dependency
        run: python -m pip install jsonschema==4.25.1
      - name: Validate synthetic design contracts and existing intake guard
        run: |
          python -m unittest discover -s tests -p test_clinical_intelligence_preparation.py -v
          python -m unittest discover -s tests -p test_clinical_gateway_guidance.py -v
          python -m unittest discover -s tests -p test_adapter_intake_contract.py -v
