name: PI-1954 Pharma 0.1.1 Validation

on:
  push:
    branches:
      - pi/validate/pharma-0-1-1-admission-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create minimal runtime contract stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pi1954_stubs/adapters /tmp/pi1954_stubs/devtools
          touch /tmp/pi1954_stubs/adapters/__init__.py
          touch /tmp/pi1954_stubs/devtools/__init__.py
          cat > /tmp/pi1954_stubs/adapters/base.py <<'PY'
          class Adapter:
              pass
          PY
          cat > /tmp/pi1954_stubs/devtools/skill_citation.py <<'PY'
          from dataclasses import dataclass

          @dataclass(frozen=True)
          class CitationRef:
              locator: str
              title: str | None = None
              source_kind: str | None = None
              provider_family: str | None = None
              provider_turn_index: int | None = None

          def dedupe_citations(citations):
              seen = set()
              result = []
              for citation in citations:
                  key = (citation.locator, citation.source_kind, citation.provider_family)
                  if key in seen:
                      continue
                  seen.add(key)
                  result.append(citation)
              return tuple(result)
          PY

      - name: Compile adapter
        env:
          PYTHONPATH: /tmp/pi1954_stubs
        run: python -m compileall -q adapters/nusaibah/pharma_company_intelligence_lab

      - name: Run full deterministic suite
        env:
          PYTHONPATH: /tmp/pi1954_stubs
        run: |
          python -m unittest discover             -s adapters/nusaibah/pharma_company_intelligence_lab/tests             -p 'test_*.py'             -v

      - name: Verify correction diff boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 3120877ecbed73480a052eea17bacc2d6fd3dca5...HEAD -- adapters/nusaibah/pharma_company_intelligence_lab
          changed="$(git diff --name-only 3120877ecbed73480a052eea17bacc2d6fd3dca5...HEAD)"
          printf '%s
' "$changed"
          test -n "$changed"
          if printf '%s
' "$changed" | grep -Ev '^adapters/nusaibah/pharma_company_intelligence_lab/' >/dev/null; then
            echo "Unexpected change outside pharma adapter root" >&2
            exit 1
          fi

      - name: Verify runtime business source and portable Skill bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          protected=(
            adapters/nusaibah/pharma_company_intelligence_lab/nusaibah_pharma_company_intelligence_lab_adapter.py
            adapters/nusaibah/pharma_company_intelligence_lab/input_contract.py
            adapters/nusaibah/pharma_company_intelligence_lab/dossier_contract.py
            adapters/nusaibah/pharma_company_intelligence_lab/memory_contract.py
            adapters/nusaibah/pharma_company_intelligence_lab/agent_contract.py
            adapters/nusaibah/pharma_company_intelligence_lab/methodology_contract.py
            adapters/nusaibah/pharma_company_intelligence_lab/adapter.dependencies.json
            adapters/nusaibah/pharma_company_intelligence_lab/skills/pharma-intelligence-methodology/SKILL.md
            adapters/nusaibah/pharma_company_intelligence_lab/skills/pharma-intelligence-methodology/CHANGELOG.md
            adapters/nusaibah/pharma_company_intelligence_lab/skills/pharma-intelligence-methodology/references/benchmark-questions.json
            adapters/nusaibah/pharma_company_intelligence_lab/skills/pharma-intelligence-methodology/references/dossier-schema.json
            adapters/nusaibah/pharma_company_intelligence_lab/skills/pharma-intelligence-methodology/references/evidence-policy.md
            adapters/nusaibah/pharma_company_intelligence_lab/skills/pharma-intelligence-methodology/references/memory-policy.json
          )
          for path in "${protected[@]}"; do
            test "$(git rev-parse 3120877ecbed73480a052eea17bacc2d6fd3dca5:"$path")" = "$(git rev-parse HEAD:"$path")"
          done
