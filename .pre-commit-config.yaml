repos:
  - repo: local
    hooks:
      - id: adapter-intake-shape
        name: Adapter intake promotion shape
        entry: python -m unittest discover -s tests -p test_adapter_intake_contract.py -q
        language: system
        pass_filenames: false
        files: ^adapters/
      - id: clinical-provider-free
        name: Clinical provider-free regression
        entry: python -m pytest adapters/nusaibah/clinical_failure_intelligence/tests -q
        language: system
        pass_filenames: false
        files: ^adapters/nusaibah/clinical_failure_intelligence/
